<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Koy's Portfolio</title>
</head>
<body>
<!-- added a container to seperate the content from the rest of the page -->
    <div class="container p-4">
<div id="nav-placeholder"></div>
<!-- Arrange the introduction and portrait side by side on wider screens and stack them on smaller screens. -->
<div class="row align-items-center g-4 mt-3">
    <div class="col-md-8">
        <h1>Welcome to Jettra Koy's Portfolio</h1>
        <p>
            Welcome everyone! Today I will be showcasing my portfolio and sharing
            some of my projects. You will find my skills, projects, and my hobbies
            so you can get a better understanding of who I am and what I do.
        </p>
    </div>

    <div class="col-md-4 text-center">
<!-- Describe the portrait with alt text so visitors using screen readers can understand the image. -->        
        <img src="images/profile.jpg"
             alt="Portrait of Jettra Koy"
             width="250"
             class="img-fluid rounded">
    </div>
</div>
</div>
<!-- Load the shared navigation file so menu updates apply consistently across all three pages. -->
<script>
    $("#nav-placeholder").load("navbar.html");
</script>
</body>
</html>
